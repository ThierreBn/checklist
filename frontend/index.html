<!DOCTYPE html>
<html lang ="en">
    <head>
        <title>Checklist</title>
        <meta charset="UTF-8">
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="task-cotainer">
            <ul id="list"></ul>
        </div>
        <div id="create-task-container">
            <input id="title">
            <input id="description">
            <input type="date" id="date">
            <select id="priority">
                <option value="low"></option>
                <option value="medium"></option>
                <option value="high"></option>
            </select>
            <button id="create-task">create</button>
            <dialog id="edit-dialog">
                <div id="edit-div">
                    <input id="edit-title" placeholder="title">
                    <input id="edit-description" placeholder="description">
                    <input id="edit-due-date" type="date">
                    <select id="edit-priority">
                        <option value="low"></option>
                        <option value="medium"></option>
                        <option value="high"></option>
                    </select>
                    <button id="edit-task">edit</button>
                </div>
            </dialog>
        </div>
        
    </body>
</html>
